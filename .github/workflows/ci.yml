# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Linux CI: build, vet, and unit-test on every push and PR. The primary platform
# had no automated Go test/vet coverage before (only windows-ci.yml ran tests,
# on Windows) — so a regression on Linux/macOS could land unnoticed.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
