# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Build the OpenZFS bundle the Windows installer stages into the vectoradb WSL2
# distro. The runner's own kernel is irrelevant: OpenZFS is compiled against the
# Microsoft WSL2 kernel *source tree* pinned in deploy/wsl-zfs/build.sh, and the
# build asserts the resulting kernel release matches EXPECT_RELEASE.
#
# Slow (a full kernel build), so this does not run on every PR.
name: wsl-zfs

# Manual only. Tagged releases build their kernels from the matrix in
# wsl-distro.yml; this is for adding one more kernel to a release that already
# exists -- which is what a user hitting "no ZFS module bundle published for this
# WSL kernel" needs, without rebuilding everything else.
on:
  workflow_dispatch:
    inputs:
      kernel_tag:
        description: 'microsoft/WSL2-Linux-Kernel tag (e.g. linux-msft-wsl-6.18.33.2)'
        required: true
      release_tag:
        description: 'Release to attach the bundle to (e.g. v0.5.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Build ZFS for ${{ inputs.kernel_tag }}
        env:
          KERNEL_TAG: ${{ inputs.kernel_tag }}
        run: |
          set -eux
          # Derived from the tag rather than asked for separately, so the two
          # cannot disagree. build.sh asserts the built kernel matches, so a bad
          # tag fails loudly instead of shipping modules that cannot load.
          EXPECT_RELEASE="${KERNEL_TAG#linux-msft-wsl-}-microsoft-standard-WSL2"
          export EXPECT_RELEASE
          make wsl-zfs

      - name: Summarize
        run: |
          echo "kernel release: $(cat dist/vectoradb-zfs.release)"
          ls -la dist/

      # Only the modules: the userland ships inside the distro image, which this
      # workflow does not rebuild.
      - name: Attach the module bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -eux
          gh release upload "$TAG" dist/vectoradb-zfs-modules-*.tar.gz --clobber

          # Keep SHA256SUMS complete, or setup skips verifying this bundle.
          cd dist
          gh release download "$TAG" -p SHA256SUMS -O existing.txt 2>/dev/null || : > existing.txt
          sha256sum vectoradb-zfs-modules-*.tar.gz > mine.txt
          awk '{print $2}' mine.txt > names.txt
          grep -vFf names.txt existing.txt > SHA256SUMS || : > SHA256SUMS
          cat mine.txt >> SHA256SUMS
          sort -k2 -o SHA256SUMS SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber
