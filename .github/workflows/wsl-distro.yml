# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Builds the prebuilt Windows distro image: one asset, every WSL kernel.
#
# This used to also build ZFS kernel modules, one job per kernel, because ZFS is
# out-of-tree and vermagic ties a module to one exact kernel. That is why a
# release could only ever cover the kernels someone had thought to list, and why
# users on any other kernel hit "no ZFS module bundle published for this WSL
# kernel". Windows now stores branches on btrfs, which is in the stock WSL
# kernel, so there is nothing kernel-specific left to build and the matrix is
# gone. wsl-zfs.yml still builds ZFS on demand if it is ever needed again.
name: wsl-distro

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach to (e.g. v0.5.0)'
        required: true

permissions:
  contents: write

jobs:
  distro:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # The image bakes in the engine binary, so it has to exist first.
      - name: Build the engine binaries
        run: make release VERSION="${TAG#v}"
        env:
          TAG: ${{ inputs.tag || github.ref_name }}

      - name: Build the distro image
        run: make wsl-distro

      # Appended, not replaced: release.yml publishes sums for the binaries.
      # Every asset the installer or setup downloads must be listed, or
      # verification silently skips it.
      - name: Checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cd dist
          gh release download "$TAG" -p SHA256SUMS -O existing.txt 2>/dev/null || : > existing.txt
          sha256sum vectoradb-distro.tar.gz > mine.txt
          awk '{print $2}' mine.txt > names.txt
          grep -vFf names.txt existing.txt > SHA256SUMS || : > SHA256SUMS
          cat mine.txt >> SHA256SUMS
          sort -k2 -o SHA256SUMS SHA256SUMS
          cat SHA256SUMS

      - name: Attach the distro image
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --prerelease --generate-notes --title "$TAG"
          gh release upload "$TAG" \
            dist/vectoradb-distro.tar.gz \
            dist/SHA256SUMS --clobber
